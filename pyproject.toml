[project]
name = "vex-platform"
version = "0.8.0"
description = "Shared job runtime, API conventions and audit log for twitch-archive and doomtp-bot"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    # Exact pin: the jobs schema SQL in vex_platform/migrations is a frozen copy of this
    # version's. Bumping it means shipping procrastinate's migrations as a new revision there.
    "procrastinate==3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "ruff>=0.17.1",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vex_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
extend = ".conventions/ruff.toml"
extend-exclude = ["spike"]  # the Phase 0 spike, kept as a record

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Test functions and fixtures go unannotated: pytest supplies their arguments, and annotating
# every fixture parameter adds noise without catching anything. Bodies are still checked.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
